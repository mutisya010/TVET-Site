# ==============================================================================
# Loima TVC (TVET Site) - Production Nginx Site Configuration Template
# ==============================================================================
# Target Domain: __DOMAIN__
# Target Path:   /etc/nginx/sites-available/tvet-site
# Symlink:       /etc/nginx/sites-enabled/tvet-site
# ==============================================================================

server {
    listen 80;
    server_name __DOMAIN__ www.__DOMAIN__;

    # Allow large document, brochure, and image uploads (up to 100MB)
    client_max_body_size 100M;

    # Gzip compression for high-performance React/Vite asset delivery
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # --------------------------------------------------------------------------
    # Maintenance Mode Bypass & Interception Logic
    # --------------------------------------------------------------------------
    set $maintenance 0;
    if (-f /etc/tvet-site/maintenance.flag) {
        set $maintenance 1;
    }

    # Only bypass if the client presents the exact valid bypass cookie
    if ($cookie_tvet_bypass = "__MAINTENANCE_BYPASS_KEY__") {
        set $maintenance 0;
    }

    # Only bypass if the query parameter matches the secret key
    if ($arg_preview_key = "__MAINTENANCE_BYPASS_KEY__") {
        set $maintenance 0;
    }
    if ($arg_bypass = "__MAINTENANCE_BYPASS_KEY__") {
        set $maintenance 0;
    }

    # Private Shareable Endpoint: /preview-access?key=SECRET_KEY
    location = /preview-access {
        if ($arg_key = "__MAINTENANCE_BYPASS_KEY__") {
            add_header Set-Cookie "tvet_bypass=$arg_key; Path=/; Max-Age=604800; SameSite=Lax";
            return 302 /;
        }
        return 302 /?error=invalid_key;
    }

    error_page 503 @maintenance_view;
    location @maintenance_view {
        root /var/www/tvet-site-frontend;
        rewrite ^(.*)$ /maintenance.html break;
    }

    location = /maintenance.html {
        root /var/www/tvet-site-frontend;
        internal;
    }

    # --------------------------------------------------------------------------
    # 1. Django Admin Proxy (Gunicorn Backend - Port 8002)
    # --------------------------------------------------------------------------
    location /admin {
        if ($maintenance = 1) {
            return 503;
        }
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }

    # --------------------------------------------------------------------------
    # 2. REST API Endpoints Proxy (Gunicorn Backend - Port 8002)
    # --------------------------------------------------------------------------
    location /api/ {
        if ($maintenance = 1) {
            return 503;
        }
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
    }

    # --------------------------------------------------------------------------
    # 3. Static Files (Django Admin CSS/JS & Collected Assets)
    # --------------------------------------------------------------------------
    location /static/ {
        alias /var/www/tvet-site-static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # --------------------------------------------------------------------------
    # 4. Media Files (Uploaded Application PDFs, Logos, Crests, Photos)
    # --------------------------------------------------------------------------
    location /media/ {
        alias /var/www/tvet-site-media/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # --------------------------------------------------------------------------
    # 5. Vite Production Build Assets (Cache hashed chunks for 30 days)
    # --------------------------------------------------------------------------
    location /assets/ {
        root /var/www/tvet-site-frontend;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # --------------------------------------------------------------------------
    # 6. Single Page Application (Vite + React) Frontend
    # --------------------------------------------------------------------------
    location / {
        if ($maintenance = 1) {
            return 503;
        }

        root /var/www/tvet-site-frontend;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }
}

